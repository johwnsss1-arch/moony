<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Moony Live Showcase</title>
<script type="module">
import "@fontsource/bricolage-grotesque/latin-800.css";
import "@fontsource/bricolage-grotesque/latin-600.css";
import "@fontsource-variable/inter";
</script>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07060d; cursor: none; }
#stage { position: absolute; inset: 0; overflow: hidden; background:
  radial-gradient(60% 70% at 15% 10%, rgba(120,100,255,.28), transparent 60%),
  radial-gradient(50% 60% at 90% 95%, rgba(255,110,190,.16), transparent 60%), #07060d; }
#grain { position: absolute; inset: -50%; opacity: .05; pointer-events: none; z-index: 70;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"); }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: auto; }
#win { position: absolute; border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 40px 120px rgba(0,0,0,.7), 0 0 120px rgba(139,125,255,.18); background: #0a0b0e; }
#app { display: block; border: 0; }
#cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; z-index: 60; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
.ripple { position: absolute; z-index: 59; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); pointer-events: none; }
#capbg { position: absolute; left: 0; right: 0; z-index: 64; pointer-events: none; }
.landscape-bg { bottom: 0; height: 46%; background: linear-gradient(0deg, rgba(5,4,12,.92), rgba(5,4,12,.55) 45%, transparent); }
.portrait-bg { top: 0; height: 34%; background: linear-gradient(180deg, rgba(5,4,12,.95), rgba(5,4,12,.6) 60%, transparent); }
#cap { position: absolute; z-index: 65; font-family: "Bricolage Grotesque", sans-serif; color: #fff; pointer-events: none; }
#cap .k { display: inline-block; font: 600 15px "Inter Variable", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #b8aeff; padding: 6px 12px; border-radius: 99px; background: rgba(139,125,255,.16); border: 1px solid rgba(184,174,255,.3); backdrop-filter: blur(8px); }
#cap h2 { margin: 12px 0 0; font-weight: 800; line-height: 1.02; letter-spacing: -.03em; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
#cap h2 span { display: inline-block; }
#card { position: absolute; inset: 0; z-index: 68; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #fff; font-family: "Bricolage Grotesque", sans-serif; pointer-events: none; }
#card img { width: 150px; filter: drop-shadow(0 0 40px rgba(170,160,255,.8)); }
#card h1 { margin: 0; font-weight: 800; font-size: 120px; letter-spacing: -.04em; line-height: 1; background: linear-gradient(180deg, #fff, #c9c3ff 60%, #8b7dff); -webkit-background-clip: text; background-clip: text; color: transparent; }
#card p { margin: 0; font: 600 26px "Inter Variable", sans-serif; color: #cfc9ff; }
#card .pill { margin-top: 10px; padding: 14px 30px; border-radius: 99px; background: #fff; color: #0b0b10; font: 700 24px "Inter Variable", sans-serif; }
.portrait #card h1 { font-size: 150px; } .portrait #card img { width: 190px; } .portrait #card p { font-size: 34px; } .portrait #card .pill { font-size: 32px; }
#before { position: absolute; inset: 0; z-index: 66; background: #1b1c20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
.b-win { width: min(84vw, 1300px); aspect-ratio: 16/10; border-radius: 10px; background: #2a2b30; border: 1px solid #3a3b40; display: flex; flex-direction: column; overflow: hidden; }
.b-bar { height: 34px; background: #232428; }
.b-body { flex: 1; display: flex; }
.b-side { width: 16%; background: #26272b; display: flex; flex-direction: column; gap: 14px; padding: 18px; }
.b-side i, .b-row i { display: block; border-radius: 6px; background: #35363b; }
.b-side i { height: 14px; }
.b-main { flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.b-hero { height: 30%; border-radius: 6px; background: #35363b; }
.b-row { display: flex; gap: 14px; flex: 1; } .b-row i { flex: 1; }
.b-btn { align-self: flex-start; padding: 10px 34px; border-radius: 4px; background: #4a4b50; color: #bbb; font: 600 18px Inter, sans-serif; }
.b-tag, #afterTag { font: 800 44px "Bricolage Grotesque", sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #fff; padding: 12px 34px; border-radius: 99px; background: #000; }
.b-sub { font: 700 40px "Bricolage Grotesque", sans-serif; color: #c8c8cc; }
#before .b-tag { order: -1; }
#afterTag { position: absolute; z-index: 67; left: 50%; top: 7%; background: linear-gradient(135deg, #a89bff, #6a5cff); box-shadow: 0 14px 50px rgba(106,92,255,.6); white-space: nowrap; pointer-events: none; }
#afterTag small { font-size: .55em; letter-spacing: .02em; text-transform: none; opacity: .9; margin-left: 8px; }
.portrait .b-tag, .portrait #afterTag { font-size: 64px; } .portrait .b-sub { font-size: 52px; }
</style>
</head>
<body>
<div id="stage">
  <div id="world"><div id="win"><iframe id="app" src="/?tour=1"></iframe></div></div>
  <div id="capbg"></div>
  <div id="cap"></div>
  <div id="card"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2.5 20 11l-7 1.8-3.6 7.2z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div id="grain"></div>
</div>
<script src="./live.js"></script>
</body>
</html>
