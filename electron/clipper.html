<!doctype html>
<html><head><meta charset="utf-8"><title>Moony Clips</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; img-src data: blob:; media-src blob:; style-src 'unsafe-inline'">
</head><body>
<script>
// Hidden recorder for Moony Clips (see clips.cjs).
const Q = new URLSearchParams(location.search);
const SECONDS = Number(Q.get("seconds")) || 30, FPS = Number(Q.get("fps")) || 60, MAXH = Number(Q.get("h")) || 1080, OUTRO = Q.get("outro") === "1";
const SEG = 6000; // ms per buffered segment
const pick = (list) => list.find((m) => MediaRecorder.isTypeSupported(m)) || "";
const RING_MIME = pick(["video/webm;codecs=h264,opus", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]);
const OUT_MIME = pick(["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4", "video/webm;codecs=h264,opus", "video/webm"]);
const icon = new Image(); icon.src = Q.get("icon") || "";

let stream = null, rec = null, recStart = 0, segs = [], busy = false;

async function begin() {
  try {
    // Desktop capture by source id (picked by Moony: the Roblox window), plus
    // your PC's sound. No picker, no user gesture needed.
    const video = { mandatory: { chromeMediaSource: "desktop", chromeMediaSourceId: Q.get("src"), maxFrameRate: FPS, maxHeight: MAXH, maxWidth: Math.round(MAXH * 16 / 9) * 2 } };
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: Q.get("sound") === "1" ? { mandatory: { chromeMediaSource: "desktop" } } : false, video }); }
    catch { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video }); } // no sound capture on this PC
  } catch (e) { window.clipper.status({ ok: false, error: e.message }); return; }
  stream.getVideoTracks()[0].addEventListener("ended", () => window.clipper.status({ ok: false, error: "Roblox window closed" }));
  rotate();
  setInterval(rotate, SEG);
  window.clipper.status({ ok: true, mime: RING_MIME, out: OUT_MIME });
}

// Start a new segment, then finish the previous one (they overlap briefly so
// no frames are lost). Only the newest segments that cover the clip length are kept.
function rotate() {
  if (!stream) return Promise.resolve();
  const prev = rec, prevStart = recStart;
  const chunks = [];
  const r = new MediaRecorder(stream, { mimeType: RING_MIME, videoBitsPerSecond: MAXH >= 1440 ? 20e6 : MAXH >= 1080 ? 12e6 : 7e6, audioBitsPerSecond: 160000 });
  r.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  r.done = new Promise((res) => { r.onstop = () => res(new Blob(chunks, { type: RING_MIME })); });
  r.start();
  rec = r; recStart = performance.now();
  if (!prev) return Promise.resolve();
  const stopped = prev.done.then((blob) => {
    segs.push({ blob, ms: performance.now() - prevStart });
    let total = segs.reduce((n, s) => n + s.ms, 0);
    while (segs.length > 1 && total - segs[0].ms >= SECONDS * 1000 + SEG) { total -= segs[0].ms; segs.shift(); }
  });
  prev.stop();
  return stopped;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Replays the buffered segments into a canvas (in real time) and records that,
// starting exactly SECONDS before the hotkey, then adds the outro.
window.saveClip = async () => {
  if (busy) return { ok: false, error: "Already saving a clip" };
  if (!stream) return { ok: false, error: "Not recording" };
  busy = true;
  try {
    await rotate();
    const list = segs.slice();
    const total = list.reduce((n, s) => n + s.ms, 0);
    if (!list.length) return { ok: false, error: "Nothing recorded yet" };
    const skip = Math.max(0, total - SECONDS * 1000);
    const st = stream.getVideoTracks()[0].getSettings();
    const H = Math.min(MAXH, st.height || 1080), W = Math.round((st.width || 1920) * (H / (st.height || 1080)) / 2) * 2;
    const canvas = Object.assign(document.createElement("canvas"), { width: W, height: H });
    const g = canvas.getContext("2d");
    const ac = new AudioContext();
    const dest = ac.createMediaStreamDestination();
    const out = new MediaStream([...canvas.captureStream(FPS).getVideoTracks(), ...dest.stream.getAudioTracks()]);
    const mr = new MediaRecorder(out, { mimeType: OUT_MIME, videoBitsPerSecond: H >= 1440 ? 24e6 : H >= 1080 ? 14e6 : 8e6, audioBitsPerSecond: 192000 });
    const parts = [];
    mr.ondataavailable = (e) => e.data.size && parts.push(e.data);
    const finished = new Promise((r) => { mr.onstop = r; });

    let played = 0, started = false;
    for (const s of list) {
      const v = document.createElement("video");
      v.src = URL.createObjectURL(s.blob);
      v.playsInline = true;
      const src = ac.createMediaElementSource(v);
      src.connect(dest); // to the clip only, never to the speakers
      await v.play().catch(() => {});
      await new Promise((resolve) => {
        const draw = () => {
          const t = played + v.currentTime * 1000;
          if (!started && t >= skip) { mr.start(); started = true; }
          if (v.videoWidth) g.drawImage(v, 0, 0, W, H);
        };
        const iv = setInterval(draw, 1000 / FPS);
        const end = () => { clearInterval(iv); resolve(); };
        v.onended = end; v.onerror = end;
        setTimeout(end, s.ms + 3000); // safety
      });
      played += s.ms;
      src.disconnect();
      URL.revokeObjectURL(v.src);
    }
    if (!started) mr.start();
    if (OUTRO) await outro(g, W, H, ac, dest);
    mr.stop();
    await finished;
    ac.close();
    const blob = new Blob(parts, { type: OUT_MIME });
    const file = await window.clipper.save(new Uint8Array(await blob.arrayBuffer()), OUT_MIME.includes("mp4") ? "mp4" : "webm");
    return { ok: true, file };
  } catch (e) {
    return { ok: false, error: e.message };
  } finally { busy = false; }
};

// 3-second end card: the Moony logo, website and Discord invite, with a chime.
async function outro(g, W, H, ac, dest) {
  const chime = (f, at, d = 0.9) => {
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = "sine"; o.frequency.value = f;
    gn.gain.setValueAtTime(0, ac.currentTime + at);
    gn.gain.linearRampToValueAtTime(0.18, ac.currentTime + at + 0.02);
    gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + at + d);
    o.connect(gn).connect(dest); o.start(ac.currentTime + at); o.stop(ac.currentTime + at + d);
  };
  chime(784, 0.05); chime(1175, 0.18); chime(1568, 0.32, 1.4);
  const last = document.createElement("canvas"); last.width = W; last.height = H; last.getContext("2d").drawImage(g.canvas, 0, 0);
  const DUR = 3200, t0 = performance.now(), u = H / 1080;
  const ease = (k) => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
  const discord = new Path2D("M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18 18 0 0 0-5.6 0L8.6 3a19.5 19.5 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1A19.8 19.8 0 0 0 6.1 21l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4-2 1 1.3 2.1a19.7 19.7 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7ZM8 15.4c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.6 8 10.6s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z");
  const globe = new Path2D("M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2c.9 0 2.3 1.9 2.8 5H9.2C9.7 5.9 11.1 4 12 4Zm-2.9.6A13 13 0 0 0 7.2 9H4.9a8 8 0 0 1 4.2-4.4Zm5.8 0A8 8 0 0 1 19.1 9h-2.3a13 13 0 0 0-1.9-4.4ZM4.3 11h2.7a20 20 0 0 0 0 2H4.3a8 8 0 0 1 0-2Zm4.7 0h6a17 17 0 0 1 0 2H9a17 17 0 0 1 0-2Zm8 0h2.7a8 8 0 0 1 0 2H17a20 20 0 0 0 0-2ZM4.9 15h2.3a13 13 0 0 0 1.9 4.4A8 8 0 0 1 4.9 15Zm4.3 0h5.6c-.5 3.1-1.9 5-2.8 5s-2.3-1.9-2.8-5Zm7.6 0h2.3a8 8 0 0 1-4.2 4.4 13 13 0 0 0 1.9-4.4Z");
  return new Promise((resolve) => {
    const iv = setInterval(() => {
      const t = performance.now() - t0, k = t / DUR;
      // Blurred, darkened last frame behind the card.
      g.filter = `blur(${Math.min(24, t / 12) * u}px)`; g.drawImage(last, 0, 0, W, H); g.filter = "none";
      g.fillStyle = `rgba(7,6,15,${Math.min(0.82, t / 500)})`; g.fillRect(0, 0, W, H);
      const glow = g.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, H * 0.6);
      glow.addColorStop(0, `rgba(139,125,255,${0.35 * ease(t / 600)})`); glow.addColorStop(1, "rgba(139,125,255,0)");
      g.fillStyle = glow; g.fillRect(0, 0, W, H);
      // Logo pops in.
      const s = ease(t / 520) * (1 + 0.06 * Math.max(0, 1 - Math.abs(t - 520) / 260));
      const size = 190 * u * s;
      g.save(); g.shadowColor = "rgba(170,160,255,.85)"; g.shadowBlur = 60 * u;
      if (icon.complete && icon.naturalWidth) g.drawImage(icon, W / 2 - size / 2, H * 0.36 - size / 2, size, size);
      g.restore();
      // Name + tagline.
      const a1 = ease((t - 250) / 400);
      g.globalAlpha = a1; g.textAlign = "center"; g.textBaseline = "middle";
      const grd = g.createLinearGradient(0, H * 0.53, 0, H * 0.6); grd.addColorStop(0, "#fff"); grd.addColorStop(1, "#b8aeff");
      g.fillStyle = grd; g.font = `800 ${92 * u}px "Segoe UI", sans-serif`; g.fillText("Moony", W / 2, H * 0.56 + (1 - a1) * 20 * u);
      g.fillStyle = "rgba(255,255,255,.7)"; g.font = `600 ${30 * u}px "Segoe UI", sans-serif`; g.fillText("Clipped with Moony · free Roblox launcher", W / 2, H * 0.635);
      // Website and Discord pills.
      const pill = (i, path, text, color, delay) => {
        const a = ease((t - delay) / 350); if (a <= 0) return;
        g.globalAlpha = a;
        g.font = `700 ${32 * u}px "Segoe UI", sans-serif`;
        const tw = g.measureText(text).width, pw = tw + 110 * u, ph = 70 * u;
        const x = W / 2 + (i ? 20 * u : -20 * u - pw), y = H * 0.72 + (1 - a) * 16 * u;
        g.fillStyle = "rgba(255,255,255,.08)"; g.strokeStyle = "rgba(184,174,255,.35)"; g.lineWidth = 2 * u;
        g.beginPath(); g.roundRect(x, y, pw, ph, ph / 2); g.fill(); g.stroke();
        g.save(); g.translate(x + 26 * u, y + ph / 2 - 15 * u); g.scale(1.25 * u, 1.25 * u); g.fillStyle = color; g.fill(path); g.restore();
        g.fillStyle = "#fff"; g.textAlign = "left"; g.fillText(text, x + 72 * u, y + ph / 2 + 1); g.textAlign = "center";
      };
      pill(0, globe, "moonylauncher.xyz", "#b8aeff", 600);
      pill(1, discord, "discord.gg/moonylauncher", "#5865F2", 750);
      g.globalAlpha = 1;
      if (k >= 1) { clearInterval(iv); resolve(); }
    }, 1000 / FPS);
  });
}

begin();
</script>
</body></html>
