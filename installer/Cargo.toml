[package]
name = "moony-setup"
version = "4.1.0"
edition = "2021"
description = "Moony Setup"

[build-dependencies]
tauri-build = { version = "2", features = [] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync"] }
futures-util = "0.3"
dirs = "5"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
