<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moony Setup</title>
<style>
@font-face { font-family: "Outfit"; src: url(fonts/outfit-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Sora"; src: url(fonts/sora-latin-wght-normal.woff2) format("woff2"); font-weight: 100 800; }
:root {
  --ink: #070a10; --ink-2: #0c111b; --surface: #111827; --surface-2: #172033; --line: #1c2638; --line-2: #2a3650;
  --text: #eef3ff; --text-2: #a9b6cc; --text-3: #6f7d95;
  --blue: #8db8ff; --blue-hi: #b3cfff; --blue-deep: #4a78ee;
  --good: #6fd3b0; --warn: #e3c07a; --bad: #e58a96;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--ink); color: var(--text); font: 400 14px/1.55 "Outfit", system-ui, sans-serif; user-select: none; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
.app { display: grid; grid-template-rows: 52px 1fr; height: 100vh; position: relative; isolation: isolate; }
.app::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(700px 500px at 88% 55%, rgba(74, 120, 238, .16), transparent 70%), linear-gradient(180deg, var(--ink-2), var(--ink) 60%); }

.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px 0 22px; border-bottom: 1px solid var(--line); }
.brand { font-family: "Sora"; font-family: "Sora"; display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 18px; letter-spacing: -.045em; }
.brand svg { width: 20px; height: 20px; }
.brand small { font-weight: 600; font-size: 11px; letter-spacing: 0; color: var(--text-3); padding: 2px 7px; border-radius: 6px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.steps { position: relative; list-style: none; padding: 0; display: flex; gap: 4px; height: 52px; align-items: center; }
.steps .marker { position: absolute; bottom: -1px; left: 0; height: 2px; width: 0; border-radius: 2px; background: var(--blue); box-shadow: 0 0 12px rgba(141, 184, 255, .7); transition: transform .45s var(--ease), width .45s var(--ease); }
.step { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 32px; color: var(--text-3); font-size: 13px; font-weight: 600; transition: color .3s; }
.step.on { color: var(--text); }
.step.past { color: var(--text-2); }
.dot { width: 16px; height: 16px; border-radius: 5px; transform: skewX(-12deg); box-shadow: inset 0 0 0 1.5px var(--line-2); display: grid; place-items: center; flex: none; transition: box-shadow .3s, background .3s; }
.step.on .dot { box-shadow: inset 0 0 0 1.5px var(--blue); background: rgba(141, 184, 255, .16); }
.step.past .dot { box-shadow: none; background: var(--good); }
.dot svg { width: 10px; height: 10px; opacity: 0; transform: skewX(12deg); }
.step.past .dot svg { opacity: 1; }
.dot path { stroke: var(--ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset .4s .1s var(--ease); }
.step.past .dot path { stroke-dashoffset: 0; }
.bar { display: flex; justify-content: flex-end; gap: 2px; }
.bar button { width: 36px; height: 30px; border: 0; background: none; border-radius: 7px; display: grid; place-items: center; color: var(--text-3); cursor: pointer; transition: background .15s, color .15s; }
.bar button:hover { background: rgba(255, 255, 255, .06); color: var(--text); }
.bar button.x:hover { background: #c23a5a; color: #fff; }
.bar svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.6; fill: none; }

.body { display: grid; grid-template-columns: 1fr 290px; min-height: 0; }
.pages { position: relative; min-width: 0; }
.stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border-left: 1px solid var(--line); overflow: hidden; }
.stage::before { content: ""; position: absolute; width: 420px; height: 520px; right: -170px; top: -80px; transform: skewX(-14deg); opacity: .045; pointer-events: none;
  background: linear-gradient(90deg, var(--blue) 0 22%, transparent 22% 39%, var(--blue) 39% 61%, transparent 61% 78%, var(--blue) 78%); }
.mark { position: relative; width: 150px; height: 150px; }
.mark svg { width: 100%; height: 100%; overflow: visible; }
.fb { transform-box: fill-box; transform-origin: 50% 100%; }
.moon-glow { transition: opacity .8s var(--ease); }
.pct { font-family: "Sora"; font-family: "Sora"; font-weight: 800; font-size: 30px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--text); opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .4s var(--ease); min-height: 40px; }
.pct.on { opacity: 1; transform: none; }
.stage-foot { position: absolute; bottom: 18px; color: var(--text-3); font-size: 12px; }

.page { position: absolute; inset: 0; padding: 40px 44px 30px 44px; display: flex; flex-direction: column; opacity: 0; transform: translateY(14px); pointer-events: none; transition: opacity .3s var(--ease), transform .5s var(--ease); }
.page.left { transform: translateY(-14px); }
.page.on { opacity: 1; transform: none; pointer-events: auto; }
h1 { font-family: "Sora"; font-size: 44px; line-height: 1; letter-spacing: -.045em; font-weight: 700; max-width: 13ch; }
.lead { margin-top: 16px; color: var(--text-2); font-size: 15px; max-width: 44ch; }
.note[hidden] { display: none; }
.note { margin-top: 18px; display: inline-flex; gap: 10px; align-items: center; align-self: flex-start; padding: 8px 12px; border-radius: 8px; background: rgba(111, 211, 176, .1); box-shadow: inset 0 0 0 1px rgba(111, 211, 176, .25); color: var(--good); font-size: 13px; }
.perks { margin-top: 26px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 520px; }
.perks div { padding: 12px 14px; border-radius: 10px; background: rgba(17, 24, 39, .7); box-shadow: inset 0 0 0 1px var(--line); }
.perks b { display: block; font-size: 13px; }
.perks small { color: var(--text-3); font-size: 12px; line-height: 1.4; display: block; margin-top: 2px; }
.actions { margin-top: auto; display: flex; gap: 10px; align-items: center; }
.actions .grow { flex: 1; color: var(--text-3); font-size: 12.5px; }
.btn { height: 42px; padding: 0 22px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 600; transition: transform .16s var(--ease), background .2s, box-shadow .2s, filter .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(180deg, #a9cbff, var(--blue)); color: #06101f; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 26px -10px rgba(141, 184, 255, .9); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: var(--bad); color: #22060e; }
.btn:focus-visible, .toggle:focus-visible, .path button:focus-visible { outline: 2px solid var(--blue-hi); outline-offset: 2px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

h2 { font-family: "Sora"; font-size: 29px; line-height: 1.05; letter-spacing: -.04em; font-weight: 700; }
.sub { color: var(--text-2); margin-top: 6px; }
.field { margin-top: 24px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-3); margin-bottom: 7px; }
.path { display: flex; align-items: center; height: 44px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); padding: 0 5px 0 14px; gap: 8px; }
.path span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); direction: rtl; text-align: left; font-size: 13px; }
.path button { height: 34px; padding: 0 14px; border: 0; border-radius: 7px; background: var(--surface-2); cursor: pointer; font-weight: 600; font-size: 13px; }
.path button:hover { background: var(--line-2); }
.opts { margin-top: 14px; border-radius: 12px; background: rgba(17, 24, 39, .6); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.toggle { display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; border-top: 1px solid var(--line); transition: background .15s; }
.toggle:first-child { border-top: 0; }
.toggle:hover { background: rgba(255, 255, 255, .025); }
.toggle b { display: block; font-weight: 600; font-size: 13.5px; }
.toggle small { display: block; color: var(--text-3); font-size: 12.5px; }
.toggle .grow { flex: 1; }
.sw { width: 36px; height: 20px; border-radius: 10px; background: var(--line-2); position: relative; flex: none; transition: background .25s var(--ease); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #c9d4ea; transition: transform .3s var(--ease), background .25s; }
.toggle[aria-checked="true"] .sw { background: var(--blue); }
.toggle[aria-checked="true"] .sw::after { transform: translateX(16px); background: #fff; }

.tasks { margin-top: 22px; border-radius: 12px; background: rgba(17, 24, 39, .6); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.task { display: grid; grid-template-columns: 22px 1fr; gap: 0 12px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--line); opacity: .42; transition: opacity .3s, background .3s; }
.task:first-child { border-top: 0; }
.task.run { background: rgba(141, 184, 255, .05); }
.task.run, .task.done, .task.warn, .task.error { opacity: 1; }
.task .ic { width: 20px; height: 20px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--line-2); display: grid; place-items: center; grid-row: 1 / span 2; }
.task.run .ic { box-shadow: none; border: 2px solid transparent; border-top-color: var(--blue); border-right-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
.task.done .ic { box-shadow: none; background: var(--good); }
.task.warn .ic { box-shadow: none; background: var(--warn); }
.task.error .ic { box-shadow: none; background: var(--bad); }
.task .ic svg { width: 11px; height: 11px; stroke: var(--ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; display: none; }
.task.done .ic .ok, .task.warn .ic .bang, .task.error .ic .bang { display: block; }
.task.done .ic .ok path { stroke-dasharray: 16; stroke-dashoffset: 16; animation: draw .4s .05s var(--ease) forwards; }
.task b { font-weight: 600; font-size: 13.5px; }
.task small { grid-column: 2; color: var(--text-3); font-size: 12px; min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .mini { grid-column: 2; height: 3px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; display: none; }
.task.run.has-pct .mini { display: block; }
.task .mini i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue-deep), var(--blue)); border-radius: 2px; transition: width .3s linear; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.err { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: rgba(229, 138, 150, .1); box-shadow: inset 0 0 0 1px rgba(229, 138, 150, .3); color: #f3c0c8; display: none; max-width: 52ch; }
.err.on { display: block; }
.btn.primary, .btn.danger { min-width: 230px; height: 46px; padding: 0 28px; border-radius: 5px; font-weight: 700; font-size: 14.5px; letter-spacing: -.005em; box-shadow: none; filter: none; }
.btn.primary { background: var(--blue); color: #06101f; }
.btn.primary:hover { background: var(--blue-hi); filter: none; }
.btn.danger { background: var(--bad); }
.btn.danger:hover { background: #eea0aa; }
.btn.primary:active, .btn.danger:active { transform: translateY(1px); }
.btn.ghost { height: 46px; border-radius: 5px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region><svg viewBox="0 0 32 32" aria-hidden="true" fill="#a6c8ff"><g transform="translate(4.5 -1) skewX(-14)"><rect x="3" y="6" width="6" height="22" rx="3"/><rect x="13" y="6" width="6" height="22" rx="3"/><rect x="23" y="6" width="6" height="22" rx="3"/></g></svg>moony <small id="ver"></small></div>
    <ol class="steps" id="steps" data-tauri-drag-region><div class="marker" id="marker"></div></ol>
    <div class="bar">
      <button onclick="win('min')" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button class="x" onclick="win('close')" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
  </header>
  <div class="body">
    <main class="pages" id="pages"></main>
    <aside class="stage" data-tauri-drag-region>
      <div class="mark">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <defs><linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#f2f6ff"/><stop offset=".45" stop-color="#a6c8ff"/><stop offset="1" stop-color="#4a78ee"/></linearGradient>
          <radialGradient id="g" r=".5"><stop offset=".3" stop-color="#8db8ff" stop-opacity=".35"/><stop offset="1" stop-color="#8db8ff" stop-opacity="0"/></radialGradient></defs>
          <circle class="moon-glow" id="glow" cx="16" cy="16" r="24" fill="url(#g)"/>
          <g transform="translate(4.5 -1) skewX(-14)">
            <rect x="3" y="6" width="6" height="22" rx="3" fill="#18213a"/><rect x="13" y="6" width="6" height="22" rx="3" fill="#18213a"/><rect x="23" y="6" width="6" height="22" rx="3" fill="#18213a"/>
            <rect class="fb" x="3" y="6" width="6" height="22" rx="3" fill="url(#bg)"/><rect class="fb" x="13" y="6" width="6" height="22" rx="3" fill="url(#bg)"/><rect class="fb" x="23" y="6" width="6" height="22" rx="3" fill="url(#bg)"/>
          </g>
        </svg>
      </div>
      <div class="pct" id="pct">0%</div>
      <div class="stage-foot" id="foot">moonylauncher.xyz</div>
    </aside>
  </div>
</div>

<template id="t-welcome">
  <section class="page" data-step="0">
    <h1 id="w-title">Roblox, launched your way.</h1>
    <p class="lead" id="w-lead">Moony is a free launcher for Roblox. Setup installs everything it needs and takes about a minute.</p>
    <div class="note" id="w-note" hidden></div>
    <div class="perks"><div><b>Fast join</b><small>The best server in one click</small></div><div><b>Party mode</b><small>Follow friends between servers</small></div><div><b>Boost</b><small>Smoother games while you play</small></div></div>
    <div class="actions"><span class="grow">Free, with no ads.</span><button class="btn primary" onclick="go(1)">Continue</button></div>
  </section>
</template>
<template id="t-options">
  <section class="page" data-step="1">
    <h2>Set it up</h2>
    <p class="sub">These are the usual picks. You can change shortcuts later.</p>
    <div class="field"><label>Install location</label><div class="path"><span id="o-dir"></span><button onclick="browse()">Change</button></div></div>
    <div class="opts">
      <button class="toggle" role="switch" data-k="startMenu" aria-checked="true"><span class="grow"><b>Start menu shortcut</b><small>Find Moony by pressing the Windows key and typing its name</small></span><span class="sw"></span></button>
      <button class="toggle" role="switch" data-k="desktop" aria-checked="true"><span class="grow"><b>Desktop shortcut</b></span><span class="sw"></span></button>
      <button class="toggle" role="switch" data-k="roblox" aria-checked="true"><span class="grow"><b>Download Roblox now</b><small id="o-rbx">About 250 MB, so your first game starts right away</small></span><span class="sw"></span></button>
    </div>
    <div class="actions"><button class="btn ghost" onclick="go(0)">Back</button><span class="grow"></span><button class="btn primary" id="o-go" onclick="startInstall()">Install</button></div>
  </section>
</template>
<template id="t-install">
  <section class="page" data-step="2">
    <h2 id="i-title">Installing Moony</h2>
    <p class="sub" id="i-sub">Keep this window open. It won't take long.</p>
    <div class="tasks" id="tasks"></div>
    <div class="err" id="i-err"></div>
    <div class="actions"><span class="grow"></span><button class="btn primary" id="i-retry" hidden onclick="startInstall()">Try again</button></div>
  </section>
</template>
<template id="t-done">
  <section class="page" data-step="3">
    <h1 id="d-title">Moony is ready.</h1>
    <p class="lead" id="d-lead">Sign in with your Roblox account and pick a game. Your accounts stay encrypted on this PC.</p>
    <div class="actions"><button class="btn ghost" onclick="win('close')">Close</button><span class="grow"></span><button class="btn primary" onclick="openMoony()">Open Moony</button></div>
  </section>
</template>
<template id="t-uconfirm">
  <section class="page" data-step="0">
    <h1>Uninstall Moony?</h1>
    <p class="lead">This removes the app, its shortcuts and its entry in Settings. Roblox links go back to opening the regular Roblox player.</p>
    <div class="opts" style="margin-top:22px">
      <button class="toggle" role="switch" data-k="wipe" aria-checked="false"><span class="grow"><b>Also delete my data</b><small>Saved accounts, settings, playtime, mods and downloaded Roblox files</small></span><span class="sw"></span></button>
    </div>
    <div class="actions"><button class="btn ghost" onclick="win('close')">Keep Moony</button><span class="grow"></span><button class="btn danger" onclick="startUninstall()">Uninstall</button></div>
  </section>
</template>
<template id="t-uremove">
  <section class="page" data-step="1">
    <h2>Removing Moony</h2>
    <p class="sub">This only takes a few seconds.</p>
    <div class="tasks" id="tasks"></div>
  </section>
</template>
<template id="t-udone">
  <section class="page" data-step="2">
    <h1>Moony is uninstalled.</h1>
    <p class="lead" id="u-lead">Thanks for trying it. You can get it again any time at moonylauncher.xyz.</p>
    <div class="actions"><span class="grow"></span><button class="btn primary" onclick="finish()">Close</button></div>
  </section>
</template>

<script>
const T = window.__TAURI__;
const invoke = T ? T.core.invoke : async (c, a) => mock(c, a);
const listen = T ? T.event.listen : (e, f) => (window.__mockListen = f);
const $ = (s, r = document) => r.querySelector(s);
const svgOk = '<svg class="ok" viewBox="0 0 12 12"><path d="M2.5 6.5l2.3 2.3 4.7-5"/></svg><svg class="bang" viewBox="0 0 12 12"><path d="M6 3v3.6M6 9h.01"/></svg>';

let info, mode, step = 0, pages = [], opts = {}, installedDir = null;
const FLOW = {
  install: { labels: ["Welcome", "Options", "Install", "Ready"], pages: ["t-welcome", "t-options", "t-install", "t-done"], phases: [0.08, 0.28, null, 1] },
  uninstall: { labels: ["Confirm", "Remove", "Goodbye"], pages: ["t-uconfirm", "t-uremove", "t-udone"], phases: [1, null, 0.02] },
};
const TASKS = {
  install: [["deps", "Runtime"], ["close", "Make room"], ["files", "Moony app"], ["shortcuts", "Shortcuts"], ["register", "Apps & features"], ["roblox", "Roblox"]],
  uninstall: [["close", "Close Moony"], ["files", "App files"], ["shortcuts", "Shortcuts"], ["register", "Windows settings"], ["data", "Your data"]],
};

let phase = 0, phaseTarget = 0;
const fills = () => document.querySelectorAll(".fb");
function moonTick() {
  phase += (phaseTarget - phase) * 0.08;
  if (Math.abs(phaseTarget - phase) < 0.0005) phase = phaseTarget;
  fills().forEach((r, i) => { const v = Math.max(0, Math.min(1, phase * 3 - i)); r.style.transform = "scaleY(" + v.toFixed(3) + ")"; r.style.opacity = v > 0 ? 1 : 0; });
  $("#glow").style.opacity = 0.25 + phase * 0.75;
  requestAnimationFrame(moonTick);
}
function setPhase(p) { phaseTarget = Math.max(0, Math.min(1, p)); }

function buildSteps() {
  const ol = $("#steps");
  FLOW[mode].labels.forEach((l, i) => {
    const li = document.createElement("li");
    li.className = "step"; li.innerHTML = `<span class="dot"><svg viewBox="0 0 12 12"><path d="M2.5 6.5l2.3 2.3 4.7-5"/></svg></span>${l}`;
    ol.appendChild(li);
  });
  FLOW[mode].pages.forEach((id) => { const n = $("#" + id).content.firstElementChild.cloneNode(true); $("#pages").appendChild(n); pages.push(n); });
}
function go(n) {
  const prev = step; step = n;
  pages.forEach((p, i) => { p.classList.toggle("on", i === n); p.classList.toggle("left", i < n); p.inert = i !== n; });
  document.querySelectorAll(".step").forEach((s, i) => { s.classList.toggle("on", i === n); s.classList.toggle("past", i < n); });
  const li = document.querySelectorAll(".step")[n]; if (li) { const m = $("#marker"); m.style.width = li.offsetWidth - 16 + "px"; m.style.transform = `translateX(${li.offsetLeft + 8}px)`; }
  const ph = FLOW[mode].phases[n]; if (ph != null) setPhase(ph);
}

function toggles(root) {
  root.querySelectorAll(".toggle").forEach((b) => {
    opts[b.dataset.k] = b.getAttribute("aria-checked") === "true";
    b.onclick = () => { const v = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", v); opts[b.dataset.k] = v; };
  });
}
function setToggle(k, v) { const b = document.querySelector(`.toggle[data-k="${k}"]`); if (b) { b.setAttribute("aria-checked", v); opts[k] = v; } }

function renderTasks() {
  const list = TASKS[mode].filter(([id]) => mode === "install" ? (id !== "roblox" || opts.roblox) : (id !== "data" || opts.wipe));
  $("#tasks").innerHTML = list.map(([id, label]) => `<div class="task" id="task-${id}"><span class="ic">${svgOk}</span><b>${label}</b><small></small><div class="mini"><i></i></div></div>`).join("");
  return list.length;
}
let total = 1, doneCount = 0, curPct = 0;
function onTask({ id, state, detail, pct }) {
  const el = $("#task-" + id); if (!el) return;
  const was = el.className;
  el.className = "task " + state + (state === "run" && pct > 0 && pct < 1 ? " has-pct" : "");
  if (detail) el.querySelector("small").textContent = detail;
  el.querySelector(".mini i").style.width = (pct * 100).toFixed(1) + "%";
  if ((state === "done" || state === "warn") && !/done|warn/.test(was)) doneCount++;
  curPct = state === "run" ? pct : 0;
  const prog = Math.min(1, (doneCount + curPct) / total);
  if (mode === "install") { setPhase(0.28 + prog * 0.72); $("#pct").textContent = Math.round(prog * 100) + "%"; }
  else setPhase(1 - prog * 0.98);
}

async function startInstall() {
  $("#i-err").classList.remove("on"); $("#i-retry").hidden = true;
  total = renderTasks(); doneCount = 0; go(2); $("#pct").classList.add("on");
  try {
    installedDir = await invoke("install", { opts: { dir: info.dir, desktop: !!opts.desktop, start_menu: !!opts.startMenu, roblox: !!opts.roblox } });
    $("#pct").textContent = "100%";
    setTimeout(() => { $("#pct").classList.remove("on"); go(3); }, 650);
  } catch (e) {
    $("#i-title").textContent = "Setup hit a problem";
    $("#i-sub").textContent = "Nothing was half-installed. Fix the issue below and try again.";
    $("#i-err").textContent = String(e); $("#i-err").classList.add("on"); $("#i-retry").hidden = false;
  }
}
async function startUninstall() {
  total = renderTasks(); doneCount = 0; go(1);
  installedDir = await invoke("uninstall", { keepData: !opts.wipe });
  if (!opts.wipe) $("#u-lead").textContent = "Your accounts and settings are still on this PC, so they'll be back if you reinstall. Get Moony again any time at moonylauncher.xyz.";
  setTimeout(() => go(2), 500);
}
async function browse() { const d = await invoke("pick_dir", { current: info.dir }); if (d) { info.dir = d; $("#o-dir").textContent = d; } }
function openMoony() { invoke("launch", { dir: installedDir || info.dir }); }
function finish() { invoke("finish", { dir: installedDir }); }
function win(a) { if (mode === "uninstall" && step === 2) return finish(); invoke("win", { a }); }

(async function init() {
  info = await invoke("info");
  mode = info.mode;
  document.title = mode === "install" ? "Moony Setup" : "Uninstall Moony";
  $("#ver").textContent = "v" + info.version;
  buildSteps(); toggles(document);
  if (mode === "install") {
    $("#o-dir").textContent = info.dir;
    setToggle("desktop", info.desktop);
    if (info.robloxReady) { setToggle("roblox", false); $("#o-rbx").textContent = "Roblox is already downloaded. Turn this on to get the newest version now."; }
    if (info.existing) {
      $("#w-title").textContent = info.existing === info.version ? "Reinstall Moony." : `Update Moony to ${info.version}`;
      $("#w-lead").textContent = "Your accounts, settings and playtime stay exactly as they are.";
      const n = $("#w-note"); n.hidden = false; n.textContent = `Moony ${info.existing} is installed on this PC`;
    }
  } else { setPhase(1); }
  listen("task", (e) => onTask(e.payload));
  requestAnimationFrame(moonTick); go(0); document.fonts?.ready.then(() => go(step));
})();

async function mock(c, a) {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  if (c === "info") return { version: "3.0.0", mode: new URLSearchParams(location.search).get("mode") || "install", dir: "C:\\Users\\you\\AppData\\Local\\Moony", existing: new URLSearchParams(location.search).get("existing"), desktop: true, robloxReady: false };
  const emit = (id, state, detail, pct = 1) => window.__mockListen?.({ payload: { id, state, detail, pct } });
  if (c === "install") {
    for (const [id] of TASKS.install) { if (id === "roblox" && !a.opts.roblox) continue; emit(id, "run", "Working…", 0); await wait(500);
      if (id === "roblox") for (let i = 1; i <= 20; i++) { emit(id, "run", `Downloading Roblox… ${i * 12} of 240 MB`, i / 20); await wait(120); }
      emit(id, "done", "Done"); }
    return a.opts.dir;
  }
  if (c === "uninstall") { for (const [id] of TASKS.uninstall) { if (id === "data" && a.keepData) continue; emit(id, "run", "Working…", 0); await wait(350); emit(id, "done", "Done"); } return "C:\\x"; }
}
