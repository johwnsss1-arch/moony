[package]
name = "moony"
version = "2.0.0"
edition = "2021"
description = "Moony, a free Roblox launcher"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync"] }
base64 = "0.22"
dirs = "5"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
once_cell = "1"
discord-rich-presence = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
