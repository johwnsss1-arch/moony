<!doctype html><html><head><meta charset="utf-8"><style>:root{--accent:#8b7dff}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI Variable Text","Segoe UI",sans-serif;user-select:none}
.card{position:absolute;inset:10px;border-radius:16px;overflow:hidden;color:#f2f1f7;-webkit-app-region:drag;
  background:radial-gradient(90% 70% at 50% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 70%),linear-gradient(180deg,rgba(32,30,46,.96),rgba(18,18,26,.97));
  border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center}
.top{align-self:stretch;display:flex;justify-content:space-between;padding:11px 14px 0;font-size:11.5px;color:rgba(255,255,255,.62);font-weight:600}
.icon{margin-top:22px;width:78px;height:78px;border-radius:18px;display:grid;place-items:center;transform:rotate(-12deg);animation:bob 2.6s ease-in-out infinite;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#1b1640));box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.icon img{width:52px;height:52px}
.icon.game{background:#000;padding:0;overflow:hidden}.icon.game img{width:100%;height:100%;object-fit:cover}
.title{margin-top:18px;font-size:12px;color:rgba(255,255,255,.55);max-width:86%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:15px}
.step{margin-top:4px;font-size:21px;font-weight:600;letter-spacing:-.01em;text-align:center;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.err{color:#ff8a96;font-size:16px}
.bar{margin-top:16px;width:84%;height:7px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden}
.fill{height:100%;width:6%;border-radius:7px;background:linear-gradient(90deg,var(--accent),#fff);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.fill.indet{width:28%;animation:indet 1.2s ease-in-out infinite;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent)}
.foot{margin-top:7px;font-size:11px;color:rgba(255,255,255,.45);height:14px}
.cancel{margin:auto 0 16px;padding:8px 34px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;font:500 13.5px inherit;font-family:inherit;cursor:pointer;-webkit-app-region:no-drag}
.cancel:hover{background:rgba(255,255,255,.16)}
/* Custom looks (Settings → Appearance → Loading screen) */
.art{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) saturate(1.3);opacity:0;transition:opacity .6s;z-index:0}
.art.on{opacity:.45}
.card>*:not(.art):not(canvas){position:relative;z-index:2}
#fx{position:absolute;inset:0;z-index:1;pointer-events:none}
.tag{margin-top:6px;font-size:12px;color:rgba(255,255,255,.55);height:14px;max-width:86%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-minimal .card{background:#0b0b0d;border-color:#222;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.s-minimal .icon{transform:none;animation:none;background:#151518;box-shadow:none;width:64px;height:64px}
.s-minimal .bar{height:3px}.s-minimal .fill{background:var(--accent)}
.s-neon .card{background:#05040a;border:1px solid var(--accent);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 60%,transparent),inset 0 0 30px color-mix(in srgb,var(--accent) 25%,transparent);animation:neon 2.4s ease-in-out infinite}
.s-neon .step{text-shadow:0 0 12px var(--accent)}
.s-neon .fill{box-shadow:0 0 12px var(--accent);background:var(--accent)}
.s-glass .card{background:rgba(20,20,28,.35);backdrop-filter:blur(6px)}
.s-glass .art.on{opacity:.8;filter:blur(8px) saturate(1.2)}
.s-retro .card{font-family:Consolas,"Courier New",monospace;background:#0a0a12;border-radius:6px;border:2px solid var(--accent)}
.s-retro .card::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px)}
.s-retro .icon{border-radius:4px;animation:none;transform:none}
.s-retro .bar,.s-retro .fill{border-radius:0}
.s-retro .step{text-transform:uppercase;letter-spacing:.06em;font-size:17px}
@keyframes neon{50%{box-shadow:0 0 36px color-mix(in srgb,var(--accent) 80%,transparent),inset 0 0 40px color-mix(in srgb,var(--accent) 35%,transparent)}}
@keyframes bob{50%{transform:rotate(-8deg) translateY(-5px)}}
@keyframes indet{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}
</style></head><body><div class="card"><div class="art" id="art"></div><canvas id="fx"></canvas>
<div class="top"><span id="chan">Moony</span><span id="ver"></span></div>
<div class="icon" id="icon"><img id="logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSdnJyB4MT0nNScgeTE9JzQnIHgyPScyNCcgeTI9JzI4JyBncmFkaWVudFVuaXRzPSd1c2VyU3BhY2VPblVzZSc+PHN0b3Agc3RvcC1jb2xvcj0nI2ZmZjZkOCcvPjxzdG9wIG9mZnNldD0nLjU1JyBzdG9wLWNvbG9yPScjYzljM2ZmJy8+PHN0b3Agb2Zmc2V0PScxJyBzdG9wLWNvbG9yPScjOGI3ZGZmJy8+PC9saW5lYXJHcmFkaWVudD48bWFzayBpZD0nbSc+PHJlY3Qgd2lkdGg9JzMyJyBoZWlnaHQ9JzMyJyBmaWxsPScjZmZmJy8+PGNpcmNsZSBjeD0nMjEnIGN5PScxMS41JyByPScxMCcgZmlsbD0nIzAwMCcvPjwvbWFzaz48L2RlZnM+PGNpcmNsZSBjeD0nMTUnIGN5PScxNycgcj0nMTInIGZpbGw9J3VybCgjZyknIG1hc2s9J3VybCgjbSknLz48cGF0aCBkPSdNMjUuNSAzLjVsLjkgMi4xIDIuMS45LTIuMS45LS45IDIuMS0uOS0yLjEtMi4xLS45IDIuMS0uOXonIGZpbGw9JyNmZmY2ZDgnLz48L3N2Zz4="></div>
<div class="title" id="title"></div>
<div class="step" id="step">Starting…</div>
<div class="tag" id="tag"></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="foot" id="foot"></div>
<button class="cancel" id="cancel">Cancel</button>
</div><script>
window.setState = (s) => {
  const $ = (id) => document.getElementById(id);
  if (s.title != null) $("title").textContent = s.title;
  if (s.step != null) { $("step").textContent = s.step; $("step").className = "step" + (s.error ? " err" : ""); }
  if (s.foot != null) $("foot").textContent = s.foot;
  if (s.channel != null) $("chan").textContent = "Channel: " + s.channel;
  if (s.version != null) $("ver").textContent = s.version ? "Version: " + s.version : "";
  const f = $("fill");
  if (s.progress == null) f.className = "fill indet"; else { f.className = "fill"; f.style.width = Math.max(4, Math.min(100, s.progress)) + "%"; }
  if (s.image) { $("logo").src = s.image; $("icon").classList.add("game"); if (q.get("art") !== "0") { $("art").style.backgroundImage = "url('" + String(s.image).replace(/'/g, "%27") + "')"; $("art").classList.add("on"); } }
};

const q = new URLSearchParams(location.search);
document.documentElement.className = "s-" + (/^(classic|minimal|neon|glass|retro)$/.test(q.get("style") || "") ? q.get("style") : "classic");
document.getElementById("tag").textContent = (q.get("tag") || "").slice(0, 60);
// Twinkling stars behind the card content.
if (q.get("fx") === "stars") {
  const cv = document.getElementById("fx"), g = cv.getContext("2d");
  const fit = () => { cv.width = cv.offsetWidth; cv.height = cv.offsetHeight; };
  fit();
  const st = Array.from({ length: 70 }, () => [Math.random(), Math.random(), Math.random() * 6.28, 0.4 + Math.random()]);
  (function f(t) { g.clearRect(0, 0, cv.width, cv.height); for (const [x, y, p, r] of st) { g.fillStyle = "rgba(255,255,255," + (0.25 + 0.6 * Math.abs(Math.sin(t / 900 + p))) + ")"; g.fillRect(x * cv.width, y * cv.height, r, r); } requestAnimationFrame(f); })(0);
}
if (/^#[0-9a-f]{6}$/i.test(q.get("accent") || "")) document.documentElement.style.setProperty("--accent", q.get("accent"));
document.getElementById("cancel").onclick = () => window.__TAURI_INTERNALS__?.invoke("ipc", { channel: "splash:cancel", args: [] });
document.querySelector(".card").setAttribute("data-tauri-drag-region", "");
</script></body></html>
